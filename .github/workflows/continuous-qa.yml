name: Validar empresa continua
on:
  pull_request:
  push:
    branches: [feat/empresa-continua-restauracao]
permissions:
  contents: read
concurrency:
  group: continuous-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm test
      - run: npm run test:continuous
      - run: python -m pip install playwright==1.57.0
      - name: Browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - run: python tools/qa-company-continuous.py
      - name: Archive reviewed source
        if: always()
        run: mkdir -p artifacts/continuous && git archive --format=zip HEAD > artifacts/continuous/reviewed-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: continuous-qa
          path: artifacts/continuous/
          retention-days: 7
