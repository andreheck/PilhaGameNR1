name: Verificar layout dos herois
on:
  pull_request:
    paths:
      - 'ui/hero-neon.*'
      - 'ui/player-onboarding.*'
      - 'assets/ui/hero-office.svg'
      - 'tools/qa-hero-neon.py'
      - '.github/workflows/hero-neon-qa.yml'
permissions:
  contents: read
concurrency:
  group: hero-neon-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm test
      - run: python -m pip install playwright==1.57.0
      - name: Use installed browser when available
        run: |
          if command -v google-chrome > /dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium > /dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - run: python tools/qa-hero-neon.py
      - name: Archive reviewed source without credentials
        if: always()
        run: |
          mkdir -p artifacts/hero-neon
          git archive --format=zip --output=artifacts/hero-neon/reviewed-source.zip HEAD
      - name: Save screenshots and result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hero-neon-qa
          path: artifacts/hero-neon/
          retention-days: 7
