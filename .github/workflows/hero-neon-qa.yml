name: Verificar layout dos herois
on:
  push:
    branches: [feat/hero-spotlight-codex]
  pull_request:
    paths:
      - 'ui/hero-neon.*'
      - 'assets/ui/hero-office.svg'
      - 'tools/qa-hero-neon.py'
      - '.github/workflows/hero-neon-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm test
      - run: python -m pip install playwright==1.57.0
      - name: Use installed browser when available
        run: |
          if command -v google-chrome > /dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium > /dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - run: python tools/qa-hero-neon.py
      - name: Save screenshots and result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hero-neon-qa
          path: artifacts/hero-neon/
          retention-days: 7
