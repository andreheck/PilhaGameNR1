name: Validar HUD v2 experimental
on:
  pull_request:
    paths:
      - 'ui/**'
      - 'simulation/hud-preferences.js'
      - 'simulation/storage-keys.js'
      - 'tools/qa-hud-v2.py'
      - '.github/workflows/hud-v2.yml'
permissions:
  contents: read
concurrency:
  group: hud-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hud:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build
      - run: node --test tests/hud-v2.test.mjs tests/storage-contract.test.mjs
      - run: |
          python -m pip install playwright==1.57.0
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
          npm install --prefix artifacts/a11y-deps --ignore-scripts --no-package-lock --no-audit --no-fund axe-core@4.10.3
      - run: python tools/qa-hud-v2.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hud-v2-qa
          path: artifacts/hud-v2/
          retention-days: 7
