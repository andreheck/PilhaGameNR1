name: Importar salao PilhA+
on:
  push:
    branches: [release/alpha15-opening-characters]
    paths: [.github/workflows/import-open-hall.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'andreheck/PilhaGameNR1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/alpha15-opening-characters
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recuperar pacote verificado
        run: |
          curl --fail --location --retry 2 --max-time 90 'https://sb-77kqmalwmc3d.vercel.run/import-a11b91d040f742acbe39e8bc6b2f075a.zip' -o /tmp/pilha-open-hall.zip
          echo '8715b899fb64e88f88a0d9c0e5b94a4570eab3eda67675a9fc49739d595feb2b  /tmp/pilha-open-hall.zip' | sha256sum --check
          python3 - <<'PY'
          import zipfile, pathlib
          root = pathlib.Path.cwd()
          with zipfile.ZipFile('/tmp/pilha-open-hall.zip') as z:
              for member in z.infolist():
                  p = pathlib.PurePosixPath(member.filename)
                  if p.is_absolute() or '..' in p.parts or any(x.startswith('.') for x in p.parts):
                      raise ValueError('Invalid package path: ' + member.filename)
                  if member.file_size > 6000000:
                      raise ValueError('Unexpected large file: ' + member.filename)
              z.extractall(root)
          PY
      - name: Validar codigo e regressao
        run: |
          node --check world3d.js
          node --check play.js
          node --check open-hall.js
          node --check pilha-intro.js
          npm test
          git diff --check
      - name: Versionar apenas a branch de release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html play.js world3d.js package.json open-hall.js resource-catalog.js pilha-intro.css pilha-intro.js pilha-iso.js opening.js game-refine.css tests/alpha14.test.mjs tests/case02-integration.test.mjs tests/open-hall.test.mjs docs/releases/SALAO-UNICO-2026-10-19.md assets/open-hall-fallback.webp assets/actors/mentor-pilha.glb assets/actors/mentora-biblioteca.glb assets/actors/manifest-new.json assets/actors/mentor-portrait.webp assets/actors/mentora-portrait.webp
          git diff --cached --quiet && exit 0
          git commit -m 'feat: open shared hall, interactive resource upgrades and supplied rigged mentors'
          git push origin HEAD:release/alpha15-opening-characters
