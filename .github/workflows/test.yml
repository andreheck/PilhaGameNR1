name: Validar jogo
on:
  push:
    branches: [main, integration/unificado-2026-10-26]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build
      - run: npm test
      - name: All test files
        run: node --test --test-concurrency=2 tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser and accessibility dependencies (CI only)
        run: |
          python -m pip install playwright==1.57.0
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
          npm install --prefix artifacts/a11y-deps --ignore-scripts --no-package-lock --no-audit --no-fund axe-core@4.10.3
      - name: Desktop and mobile accessibility gate
        run: python tools/qa-accessibility.py
      - name: Archive accessibility reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-qa
          path: artifacts/accessibility/
          retention-days: 7
