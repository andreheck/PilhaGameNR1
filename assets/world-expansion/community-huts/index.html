<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barracos do morro</title><style>body{margin:0;padding:28px;background:#15232b;color:#f2eee4;font:15px system-ui}h1{margin:0 0 8px}p{color:#b9c6c5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{padding:12px;border:1px solid #45575b;border-radius:12px;background:#1d3038}.img{height:250px;display:grid;place-items:center;border-radius:8px;background-color:#ddd;background-image:linear-gradient(45deg,#bbb 25%,transparent 25%),linear-gradient(-45deg,#bbb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#bbb 75%),linear-gradient(-45deg,transparent 75%,#bbb 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.img img{width:100%;height:100%;object-fit:contain}.card h2{font-size:16px;margin:10px 0 4px}.card p{margin:0;font-size:13px}</style><h1>Barracos do morro</h1><p>Seis sprites separados • 2D aprimorado isométrico • fundo transparente</p><main class="grid"><script>const items=[['01 · Reboco gasto','reboco gasto • telha ondulada • caixa d’água azul'],['02 · Tijolo aparente','sem reboco • telha ondulada'],['03 · Laje colorida','laje • caixa d’água azul'],['04 · Bloco aparente','sem reboco • laje'],['05 · Pastel','reboco colorido • telha ondulada • caixa d’água azul'],['06 · Azul e coral','reboco colorido • telha ondulada']];document.write(items.map(([n,d],i)=>`<article class="card"><div class="img"><img src="barraco-0${i+1}-${['reboco-gasto','tijolo-aparente','laje-caixa-azul','bloco-aparente-laje','pastel-caixa-azul','azul-coral'][i]}.png"></div><h2>${n}</h2><p>${d}</p></article>`).join(''))</script></main></html>
