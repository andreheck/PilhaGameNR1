<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PilhA+ Game</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ef;color:#14273d;font:16px system-ui,sans-serif}.wrap{max-width:960px;margin:auto;padding:16px}header{padding:22px;border-radius:18px;background:#14273d;color:white;margin:12px 0}h1{margin:0}h1 b{color:#f58a2b}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{border:0;border-radius:12px;padding:12px 16px;background:#14273d;color:white;cursor:pointer;font:inherit}button.active,.primary{background:#f58a2b}section{background:white;padding:22px;border-radius:18px;box-shadow:0 4px 18px #14273d14;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tile{background:#f7f4ef;border-radius:14px;padding:18px}.room{background:#dce9e3;text-align:center;border:2px solid #7b9f85;cursor:pointer;min-height:130px}.room:hover{border-color:#f58a2b}.choice{display:block;width:100%;text-align:left;color:#14273d;background:#f7f4ef;margin:10px 0}.choice:hover{outline:2px solid #f58a2b}p{line-height:1.55}.note{font-size:12px;color:#667789}</style></head><body><div class="wrap"><header><h1>PilhA<b>+</b> Game</h1><p>Gestão de riscos psicossociais · Protótipo web experimental</p></header><nav id="nav"></nav><main id="screen"></main><p class="note">Cenário e indicadores inteiramente fictícios. Não é avaliação profissional, diagnóstico ou comprovação normativa NR-1.</p></div><script>let page="home",role="lideranca",sources=[];const roles={lideranca:"Liderança",rhsst:"RH / SST",trabalhadores:"Trabalhadores"};const menu=[["home","Início"],["mapa","Ambientes"],["caso","Caso 017"],["investigar","Investigação"],["acao","Plano de ação"]];function go(p){page=p;render()}function choose(r){role=r;go("mapa")}function add(s){if(!sources.includes(s))sources.push(s);render()}function result(x){go("resultado"+x)}function render(){document.querySelector("#nav").innerHTML=menu.map(([k,v])=>'<button class="'+(page===k?"active":"")+'" onclick="go(\''+k+'\')">'+v+"</button>").join("");let h="";if(page==="home"){h='<section><h2>Escolha sua perspectiva</h2><p>O mesmo caso é examinado por liderança, RH/SST e trabalhadores.</p><div class="grid">'+Object.entries(roles).map(([k,v])=>'<div class="tile"><h3>'+v+'</h3><button class="primary" onclick="choose(\''+k+'\')">Selecionar</button></div>').join("")+"</div></section>"}else if(page==="mapa"){h='<section><h2>Empresa em crescimento</h2><p>Perspectiva: <b>'+roles[role]+'</b>. Selecione uma sala para continuar.</p><div class="grid"><div class="tile room" onclick="go(\'caso\')"><h3>Central de Riscos</h3>Indicadores e casos</div><div class="tile room" onclick="go(\'investigar\')"><h3>Escuta e Investigação</h3>Fontes e evidências</div><div class="tile room" onclick="go(\'acao\')"><h3>Planejamento</h3>Intervenções e acompanhamento</div></div></section>'}else if(page==="caso"){h='<section><h2>Caso 017 — Sobrecarga na logística</h2><p>Aumento de horas extras, conflitos e afastamentos. Quais fatores ligados à organização do trabalho precisam ser investigados?</p><div class="grid"><div class="tile">Horas extras: <b>+34%</b></div><div class="tile">Ausências: <b>+18%</b></div><div class="tile">Rotatividade: <b>+7%</b></div></div><p><button class="primary" onclick="go(\'investigar\')">Investigar</button></p></section>'}else if(page==="investigar"){h='<section><h2>Investigação</h2><p>Fontes coletadas: '+sources.length+' de 4. Ouça diferentes perspectivas antes de intervir.</p><div class="grid">'+["Relatos de trabalhadores","Escuta da liderança","Documentos de jornada","Indicadores coletivos"].map((s,i)=>'<div class="tile"><h3>'+s+'</h3><button onclick="add('+i+')">'+(sources.includes(i)?"Evidência coletada":"Coletar evidência")+'</button></div>').join("")+'</div><p><button class="primary" onclick="go(\'acao\')">Planejar ação</button></p></section>'}else if(page==="acao"){h='<section><h2>Plano de ação</h2><p>Qual medida você escolheria para enfrentar os riscos relacionados à organização do trabalho?</p>'+["Promover uma palestra de saúde mental","Reorganizar metas, jornada e distribuição de carga","Oferecer um aplicativo de meditação"].map((s,i)=>'<button class="choice" onclick="result('+i+')">'+String.fromCharCode(65+i)+". "+s+"</button>").join("")+"</section>"}else{const i=Number(page.slice(-1));h='<section><h2>Aprendizagem</h2><p>'+["A conscientização ajuda, mas não substitui prevenção de fatores organizacionais.","Medidas sobre metas, jornada e carga atuam diretamente nas condições de trabalho; devem ser acompanhadas e ajustadas coletivamente.","Recursos individuais de bem-estar podem complementar, mas não substituem a gestão dos riscos organizacionais."][i]+'</p><p>Resultado educacional simulado, sem previsão clínica ou percentual real.</p><button class="primary" onclick="go(\'mapa\')">Voltar ao mapa</button></section>'}document.querySelector("#screen").innerHTML=h}render()</script></body></html>
