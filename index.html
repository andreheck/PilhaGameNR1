<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PilhA+ Game | Sessão 04</title>
<style>
:root{--navy:#14273d;--orange:#f58a2b;--cream:#f7f4ef;--sage:#7b9f85;--alert:#d85b48}*{box-sizing:border-box}
body{margin:0;background:#edf1ef;color:var(--navy);font:16px system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffac45;outline-offset:3px}
.shell{max-width:1200px;margin:auto;padding:14px}.top{background:var(--navy);color:white;border-radius:18px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:28px;font-weight:800}.logo span{color:var(--orange)}.top small{display:block;color:#cfdae5}.pill{display:inline-block;background:#fce7d2;color:#904e14;border-radius:30px;font-size:12px;padding:6px 10px;font-weight:750}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0}.tabs button{flex:none;background:white;border:1px solid #d4dfdf;border-radius:12px;color:var(--navy);padding:11px 13px}.tabs .selected{background:var(--orange);color:#172d40;border-color:var(--orange);font-weight:700}
.panel{background:white;border:1px solid #e0e6e5;box-shadow:0 8px 28px #14273d0c;border-radius:18px;padding:20px;margin:0 0 14px}h1,h2,h3{line-height:1.15}h2{margin:3px 0 12px}p{line-height:1.55}small,.subtle{color:#677783}
.columns{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(255px,0.8fr);gap:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:var(--cream);border:1px solid #e5e5df;border-radius:13px;padding:14px}.card h3{margin:0 0 7px;font-size:17px}.button{background:var(--navy);color:white;border:0;border-radius:11px;padding:12px 16px;font-weight:700}.button.orange{background:var(--orange);color:#17283c}.button.ghost{background:#e9f0ec;color:var(--navy)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.world{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;padding:20px;border-radius:16px;background:linear-gradient(150deg,#a6c3b5,#d2e2d4 58%,#8eaeab);overflow:hidden}
.room{border:3px solid #6a8589;border-bottom-width:9px;border-right-width:9px;border-radius:10px;min-height:183px;background:#faf0df;position:relative;text-align:left;padding:14px;box-shadow:8px 10px 0 #284a5640;transition:transform .18s ease}
.room:hover,.room:focus-visible{transform:translateY(-3px)}.room strong{display:block;position:relative;z-index:2;background:#14273de8;color:white;padding:6px 9px;border-radius:7px;width:max-content;max-width:100%;font-size:13px}
.room .scene{position:absolute;inset:37px 8px 8px;display:flex;justify-content:center;align-items:center;gap:12px;font-size:35px;filter:drop-shadow(3px 5px 0 #0002)}
.room.r2{background:#e6ecf3}.room.r3{background:#e7e9d9}.room.r4{background:#e8d5bb}
.room em{position:absolute;right:9px;bottom:8px;font-size:12px;color:#334b58;font-style:normal;background:#ffffffd9;border-radius:8px;padding:4px}
.stat{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e4e9e8;font-size:14px}.meter{width:90px;height:8px;background:#e1e5e7;border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle}.fill{height:100%;background:var(--orange)}.tag{font-size:12px;background:#fce2d8;padding:5px 8px;border-radius:7px}
.choice{display:block;width:100%;border:2px solid #e1e8e7;background:var(--cream);color:var(--navy);padding:15px;border-radius:12px;text-align:left;margin:11px 0}.choice:hover{border-color:var(--orange)}.done{color:#24734d;font-weight:700}.muted{color:#657486}.role{font-size:12px;font-weight:700;color:#456c5b}
footer{text-align:center;color:#657486;font-size:12px;margin:22px 0}@media(max-width:700px){.columns{grid-template-columns:1fr}.world{gap:8px;padding:10px}.room{min-height:150px;padding:8px}.room strong{font-size:11px}.room .scene{font-size:26px;gap:4px}.top{align-items:flex-start}.top small{font-size:11px}.panel{padding:15px}.room em{font-size:10px}}
@media(prefers-reduced-motion:reduce){.room{transition:none}}

/* Sessao 05 - sala isometrica em SVG responsivo */
.iso-stage{position:relative;margin-top:14px;background:linear-gradient(155deg,#c9ddd3,#9ebcb5);border-radius:16px;overflow:hidden;border:1px solid #bdd2ca}
.iso-stage svg{display:block;width:100%;height:auto;max-height:580px}
.iso-hotspots{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.hotspot{border:1px solid #b5c9c3;background:#f0f6f2;color:#14273d;border-radius:11px;padding:10px 13px}
.hotspot[aria-pressed="true"]{background:#f58a2b;font-weight:750;border-color:#c87422}
.object-detail{background:#f7f4ef;padding:16px;border-radius:14px;min-height:110px}

/* Sessao 06 */.layer-controls{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0}.layer-controls label{display:flex;align-items:center;gap:6px;background:#e9f0ec;padding:8px 10px;border-radius:10px;font-size:13px}.scene-s06{position:relative;isolation:isolate;overflow:hidden;border-radius:16px;background:linear-gradient(140deg,#c6ded2,#91b4aa);height:clamp(290px,48vw,540px);margin-top:14px}.iso-floor{position:absolute;left:50%;top:48%;width:66%;height:66%;transform:translate(-50%,-50%) rotate(45deg) scaleY(.60);border:13px solid #b79e7d;background:repeating-linear-gradient(0deg,#e5d8be 0px,#e5d8be 32px,#cbb99e 33px,#cbb99e 35px);box-shadow:16px 20px 0 #63857a90}.iso-wall{position:absolute;background:#e3d4b9;border:7px solid #aa9780;box-shadow:5px 7px 0 #415f5f44}.iso-wall.back{top:12%;left:24%;width:52%;height:11%;transform:skewY(-15deg)}.iso-wall.side{top:25%;left:18%;width:12%;height:43%;transform:skewY(25deg)}.iso-decor{position:absolute;font-size:clamp(25px,4.3vw,55px);filter:drop-shadow(5px 7px 1px #233b3a35)}.iso-decor.monitor{top:21%;left:44%;background:#14273d;color:#f58a2b;padding:8px;border:5px solid #628e99;border-radius:6px;font-size:clamp(18px,2.7vw,36px)}.iso-decor.desk1{top:46%;left:32%}.iso-decor.desk2{top:57%;left:60%}.iso-decor.person1{top:62%;left:36%}.iso-decor.person2{top:68%;left:66%}.iso-decor.plant1{top:32%;left:22%}.iso-decor.plant2{top:70%;left:79%}.iso-hotpoint{position:absolute;border:3px solid white;border-radius:99px;background:#f58a2b;color:#14273d;font-size:17px;font-weight:800;width:38px;height:38px;box-shadow:0 3px 10px #14273d70}.iso-hotpoint.a{top:22%;left:67%}.iso-hotpoint.b{top:54%;left:25%}.iso-hotpoint.c{top:70%;left:72%}.layer-hidden{display:none!important}
</style></head><body><div class="shell"><header class="top"><div><div class="logo">PilhA<span>+</span> Game</div><small>Simulação educacional · Sessão 06 · Camadas modulares</small></div><span class="pill">PROTÓTIPO v0.7</span></header><nav class="tabs" id="tabs" aria-label="Navegação do jogo"></nav><main id="app" aria-live="polite"></main><footer>Dados, pessoas e impactos fictícios. Não constitui diagnóstico, avaliação oficial ou comprovação de NR-1.</footer></div>
<script>
const ROLES={lideranca:{name:"Liderança",detail:"Metas, orçamento e condições para agir"},rhsst:{name:"RH / SST",detail:"Evidências, prevenção e acompanhamento"},trabalhadores:{name:"Trabalhadores",detail:"Realidade do trabalho e participação"}};
const ROOMS=[{id:"central",name:"Central de Riscos",emoji:"📊 🖥️",hint:"Investigar caso",target:"central",kind:"r1"},{id:"escuta",name:"Escuta e Investigação",emoji:"🪑 💬",hint:"Consultar fontes",target:"investigar",kind:"r2"},{id:"plano",name:"Planejamento de Ações",emoji:"📋 🗂️",hint:"Decidir medidas",target:"acao",kind:"r3"},{id:"operacao",name:"Operação Logística",emoji:"📦 👷",hint:"Observar atividade",target:"operacao",kind:"r4"}];
const SOURCES=[{id:"trabalhadores",name:"Trabalhadores",detail:"Relatam metas intensas e pausas insuficientes."},{id:"lideranca",name:"Liderança",detail:"Confirma metas mantidas após redução de pessoal."},{id:"documentos",name:"Jornada e escalas",detail:"Registros mostram horas extras recorrentes."},{id:"indicadores",name:"Indicadores",detail:"Absenteísmo e conflitos aumentaram no período."}];
let state={role:null,page:"inicio",collected:[],decision:null,visits:[]};try{const x=JSON.parse(localStorage.getItem("pilha-game-v05"));if(x&&typeof x==="object")state={...state,...x}}catch(e){}
function save(){localStorage.setItem("pilha-game-v05",JSON.stringify(state))}
function go(p){state.page=p;if(ROOMS.some(r=>r.target===p)&&!state.visits.includes(p))state.visits.push(p);save();render();window.scrollTo({top:0,behavior:"instant"})}
function role(r){state.role=r;go("mapa")}
function collect(id){if(!state.collected.includes(id))state.collected.push(id);save();render()}
function decide(i){state.decision=i;go("resultado")}
function restart(){state={role:null,page:"inicio",collected:[],decision:null,visits:[]};save();render()}
function btn(label,target,cls=""){return '<button class="button '+cls+'" data-go="'+target+'">'+label+'</button>'}
function render(){const p=state.page;const t=document.querySelector("#tabs");const tabs=[["inicio","Início"],["mapa","Mapa"],["central","Central"],["caso","Caso 017"],["investigar","Investigar"],["acao","Intervir"],["resultado","Resultado"]];t.innerHTML=tabs.map(([id,name])=>'<button data-go="'+id+'" class="'+(p===id?"selected":"")+'">'+name+"</button>").join("");let s="";
if(p==="inicio"){s='<section class="panel"><span class="pill">CAPÍTULO 01 · EMPRESA EM CRESCIMENTO</span><h2>Uma empresa. Três perspectivas.</h2><p>Explore decisões sobre fatores psicossociais relacionados ao trabalho. Escolha uma perspectiva inicial; você poderá alternar depois.</p><div class="cards">'+Object.entries(ROLES).map(([key,r])=>'<div class="card"><h3>'+r.name+'</h3><p>'+r.detail+'</p><button class="button orange" data-role="'+key+'">Escolher</button></div>').join("")+'</div></section>'}
else if(p==="mapa"){s='<div class="columns"><section class="panel"><span class="pill">AMBIENTE 01 · EMPRESA EM CRESCIMENTO</span><h2>Mapa da organização</h2><p>Selecione uma sala. As portas e a circulação serão implementadas na próxima etapa.</p><div class="world" role="group" aria-label="Quatro ambientes acessíveis">'+ROOMS.map(r=>'<button class="room '+r.kind+'" data-go="'+r.target+'" aria-label="Entrar em '+r.name+'"><strong>'+r.name+'</strong><span class="scene" aria-hidden="true">'+r.emoji+'</span><em>'+r.hint+'</em></button>').join("")+'</div></section><aside class="panel"><span class="pill">VISÃO ATUAL</span><h2>'+ (state.role?ROLES[state.role].name:"Visitante") +'</h2><p class="subtle">Personagens conceituais: gerente, profissional RH/SST, operador e assistente de prevenção.</p><h3>Mapa de sinais fictícios</h3>'+[["Carga de trabalho",78],["Conflitos",67],["Jornada",75],["Apoio da liderança",55]].map(([label,val])=>'<div class="stat"><span>'+label+'</span><span><span class="meter"><span class="fill" style="display:block;width:'+val+'%"></span></span> '+val+'</span></div>').join("")+'<div class="actions">'+btn("Trocar perspectiva","inicio","ghost")+'</div></aside></div>'}
else if(p==="central"){s='<section class="panel"><span class="pill">SALA 01 · CENÁRIO ISOMÉTRICO</span><h2>Central de Riscos</h2><p>Toque em um objeto do ambiente para descobrir como ele contribui para a investigação. A sala utiliza vetores originais escaláveis e prepara a substituição por sprites.</p><div class="layer-controls" role="group" aria-label="Camadas do cenário"><label><input type="checkbox" data-layer="walls" checked> Paredes</label><label><input type="checkbox" data-layer="furniture" checked> Móveis</label><label><input type="checkbox" data-layer="characters" checked> Personagens</label><label><input type="checkbox" data-layer="hotspots" checked> Interações</label></div><div class="scene-s06" role="group" aria-label="Central de Riscos representada em camadas"><div class="iso-floor" aria-hidden="true"></div><div data-group="walls"><div class="iso-wall back"></div><div class="iso-wall side"></div></div><div data-group="furniture" aria-hidden="true"><div class="iso-decor monitor">▂▅▃▇</div><div class="iso-decor desk1">🖥️</div><div class="iso-decor desk2">🗂️</div><div class="iso-decor plant1">🪴</div><div class="iso-decor plant2">🪴</div></div><div data-group="characters" aria-hidden="true"><div class="iso-decor person1">👩🏽‍💻</div><div class="iso-decor person2">👨🏾‍💼</div></div><div data-group="hotspots"><button class="iso-hotpoint a" data-obj="indicadores" aria-label="Analisar painel de indicadores">1</button><button class="iso-hotpoint b" data-obj="analista" aria-label="Examinar mesa de análise">2</button><button class="iso-hotpoint c" data-obj="registro" aria-label="Examinar registro de casos">3</button></div></div><div class="iso-hotspots"><button class="hotspot" data-obj="indicadores">1 · Painel de indicadores</button><button class="hotspot" data-obj="analista">2 · Mesa de análise</button><button class="hotspot" data-obj="registro">3 · Registro de casos</button></div><div class="object-detail" id="object-detail" aria-live="polite">Selecione um dos três pontos para explorar a sala.</div><div class="actions">'+btn("Abrir Caso 017","caso","orange")+btn("Voltar ao mapa","mapa","ghost")+'</div></section>'}
else if(p==="operacao"){s='<section class="panel"><span class="pill">OBSERVAÇÃO DE CAMPO</span><h2>Operação Logística</h2><p>O trabalho real nem sempre corresponde ao trabalho prescrito. Na operação, há relatos de interrupções frequentes, ritmos intensos e dificuldade para realizar pausas.</p><div class="cards"><div class="card"><h3>Personagem: operador</h3><p>Explica como acontece a distribuição cotidiana das tarefas.</p></div><div class="card"><h3>Personagem: supervisora</h3><p>Descreve demandas, metas e restrições da equipe.</p></div></div><div class="actions">'+btn("Ir à investigação","investigar","orange")+btn("Voltar ao mapa","mapa","ghost")+'</div></section>'}
else if(p==="caso"){s='<section class="panel"><span class="pill">CASO 017 · PRIORIDADE DE INVESTIGAÇÃO</span><h2>Por que a equipe está sobrecarregada?</h2><p>Após um crescimento acelerado da empresa, trabalhadores da operação logística enfrentam horas extras, conflitos e sinais coletivos de desgaste. O jogador deve levantar evidências antes de decidir.</p><div class="cards"><div class="card"><h3>+34%</h3>Horas extras</div><div class="card"><h3>+18%</h3>Ausências</div><div class="card"><h3>+7%</h3>Rotatividade</div></div><p class="subtle">Estes percentuais são inventados exclusivamente para simulação educacional.</p><div class="actions">'+btn("Investigar","investigar","orange")+btn("Mapa","mapa","ghost")+'</div></section>'}
else if(p==="investigar"){s='<section class="panel"><span class="pill">FONTES: '+state.collected.length+' / 4</span><h2>Escuta e investigação</h2><p>Combine relatos de diferentes atores com evidências documentais. Cada informação oferece uma parte da situação.</p><div class="cards">'+SOURCES.map(x=>'<div class="card"><span class="role">'+(state.collected.includes(x.id)?"EVIDÊNCIA REGISTRADA":"FONTE DISPONÍVEL")+'</span><h3>'+x.name+'</h3><p>'+(state.collected.includes(x.id)?x.detail:"Consulte esta fonte para revelar um indício.")+'</p><button class="button '+(state.collected.includes(x.id)?"ghost":"orange")+'" data-source="'+x.id+'" '+(state.collected.includes(x.id)?"disabled":"")+'>'+(state.collected.includes(x.id)?"Coletada":"Consultar")+'</button></div>').join("")+'</div><div class="actions">'+btn("Ir ao plano de ação","acao","orange")+btn("Voltar ao mapa","mapa","ghost")+'</div></section>'}
else if(p==="acao"){s='<section class="panel"><span class="pill">EVIDÊNCIAS CONSULTADAS: '+state.collected.length+' / 4</span><h2>Escolha uma medida</h2><p>Qual decisão enfrenta melhor as condições organizacionais relacionadas ao caso?</p>'+["Realizar palestra sobre saúde mental","Revisar metas, jornada, pausas e distribuição de tarefas","Oferecer aplicativo individual de meditação"].map((x,i)=>'<button class="choice" data-decision="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+x+'</button>').join("")+'<div class="actions">'+btn("Rever evidências","investigar","ghost")+'</div></section>'}
else{const messages=["A palestra pode sensibilizar, mas não resolve isoladamente metas, escalas e sobrecarga.","Revisar a organização do trabalho prioriza fatores estruturais e deve envolver os trabalhadores e acompanhamento.","Uma ferramenta de autocuidado pode complementar outras ações, mas não substitui medidas organizacionais."];s='<section class="panel"><span class="pill">FEEDBACK EDUCACIONAL</span><h2>Resultado da sua intervenção</h2><p>'+messages[state.decision??0]+'</p><div class="card"><h3>O que aprendemos?</h3><p>O reconhecimento de fatores, a consulta a diferentes fontes e medidas de prevenção relacionadas ao trabalho ajudam a orientar boas decisões. Nesta versão não há previsão de desfechos individuais ou cálculo de risco validado.</p><p>Fontes consultadas: <b>'+state.collected.length+'/4</b>.</p></div><div class="actions">'+btn("Explorar novamente","mapa","orange")+'<button class="button ghost" id="reset">Reiniciar</button></div></section>'}
document.querySelector("#app").innerHTML=s;document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>role(b.dataset.role));document.querySelectorAll("[data-source]").forEach(b=>b.onclick=()=>collect(b.dataset.source));document.querySelectorAll("[data-decision]").forEach(b=>b.onclick=()=>decide(Number(b.dataset.decision)));const details={indicadores:"Painel de indicadores: reúne sinais coletivos e tendências. Não representa diagnóstico nem avaliação validada.",analista:"Mesa de análise: a equipe organiza e compara dados, sempre considerando contexto e participação dos trabalhadores.",registro:"Registro de casos: documenta evidências e ações preventivas com cuidado sobre confidencialidade e acesso."};document.querySelectorAll("[data-obj]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-obj]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));document.querySelector("#object-detail").textContent=details[b.dataset.obj]});document.querySelectorAll("[data-layer]").forEach(input=>input.onchange=()=>{document.querySelectorAll('[data-group="'+input.dataset.layer+'"]').forEach(group=>group.classList.toggle("layer-hidden",!input.checked))});const reset=document.querySelector("#reset");if(reset)reset.onclick=restart}
render();
</script></body></html>
