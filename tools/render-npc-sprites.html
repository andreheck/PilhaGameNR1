<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Renderização local dos NPCs aprovados</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>body{background:#18243a;color:white;font:16px system-ui}canvas{background:repeating-conic-gradient(#bbc 0% 25%,#889 0% 50%) 0/24px 24px;max-width:100%}</style>
<h1>NPCs a partir dos GLBs existentes</h1><button id="render">Gerar sprites</button><p id="status">Pronto</p><div id="output"></div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const defs=[['operadora','operadora.glb'],['mentor','mentor-pilha.glb'],['mentora','mentora-biblioteca.glb']];
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(128,192);renderer.setClearColor(0,0);renderer.outputColorSpace=THREE.SRGBColorSpace;
const loader=new GLTFLoader();window.spriteExports=[];
document.getElementById('render').onclick=async()=>{try{
 for(const [key,file]of defs){
  document.getElementById('status').textContent='Renderizando '+key;
  const gl=await loader.loadAsync('/assets/actors/'+file),scene=new THREE.Scene(),model=gl.scene;
  const mixer=new THREE.AnimationMixer(model),clip=gl.animations.find(c=>/walking/i.test(c.name));if(!clip)throw Error(file+': animação Walking ausente');mixer.clipAction(clip).play();
  mixer.setTime(0);model.updateMatrixWorld(true);
  const height=new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()).y;
  const normalizer=new THREE.Group();normalizer.scale.setScalar(1.7/height);normalizer.add(model);
  const pivot=new THREE.Group();pivot.add(normalizer);scene.add(pivot);scene.add(new THREE.HemisphereLight(0xffffff,0x6f7e9c,2.5));const light=new THREE.DirectionalLight(0xffffff,2.8);light.position.set(4,7,5);scene.add(light);
  const camera=new THREE.OrthographicCamera(-.77,.77,1.15,-1.15,.1,100);camera.position.set(5,3.7,5);camera.lookAt(0,.85,0);
  const atlas=document.createElement('canvas');atlas.width=1024;atlas.height=768;const ctx=atlas.getContext('2d');
  for(let dir=0;dir<4;dir++)for(let frame=0;frame<8;frame++){pivot.position.set(0,0,0);pivot.rotation.y=dir*Math.PI/2;mixer.setTime(frame/8*clip.duration);pivot.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(pivot),c=b.getCenter(new THREE.Vector3());pivot.position.set(-c.x,-b.min.y,-c.z);renderer.render(scene,camera);ctx.drawImage(renderer.domElement,frame*128,dir*192);}
  document.getElementById('output').append(atlas);window.spriteExports.push({key,source:file,clip:clip.name,frames:8,directions:4,data:atlas.toDataURL('image/png')});mixer.stopAllAction();
 }
 document.getElementById('status').textContent='Concluído: '+window.spriteExports.length+' NPCs';
}catch(e){document.getElementById('status').textContent='Erro: '+e.message;console.error(e);}};
</script></html>
